<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amplitude Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-ok {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid;
        }

        .alert-success {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .alert-error {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .alert-info {
            background: #d1ecf1;
            border-color: #17a2b8;
            color: #0c5460;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(234, 234, 234, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .data-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .data-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .data-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .data-item-id {
            font-family: monospace;
            font-size: 0.85rem;
            color: #666;
        }

        .data-item-time {
            font-size: 0.85rem;
            color: #999;
        }

        .data-item-content {
            color: #333;
            word-break: break-word;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            border-left: 3px solid #667eea;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }

        .delete-btn {
            padding: 6px 12px;
            font-size: 0.85rem;
            background: #dc3545;
            margin-top: 10px;
            width: auto;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Amplitude API Dashboard</h1>
            <p class="subtitle">Robust Express Backend with Real-time Data Management</p>
        </header>

        <div id="alerts"></div>

        <div class="grid">
            <!-- Submit Data Card -->
            <div class="card">
                <h2>📤 Submit Data</h2>
                <form id="submitForm">
                    <div class="form-group">
                        <label for="data">Data *</label>
                        <textarea id="data" name="data" placeholder="Enter your data here..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="userId">User ID (Optional)</label>
                        <input type="text" id="userId" name="userId" placeholder="e.g., user123">
                    </div>
                    <button type="submit">Submit Data</button>
                </form>
            </div>

            <!-- System Status Card -->
            <div class="card">
                <h2>🔍 System Status</h2>
                <div style="margin-bottom: 15px;">
                    <label>Backend Status:</label>
                    <span id="statusBadge" class="status-badge status-error">Checking...</span>
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Server Uptime:</label>
                    <div id="uptime" style="color: #666; margin-top: 5px;">-</div>
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Last Check:</label>
                    <div id="lastCheck" style="color: #999; font-size: 0.85rem; margin-top: 5px;">-</div>
                </div>
                <button onclick="checkHealth()">Refresh Status</button>
            </div>

            <!-- API Statistics Card -->
            <div class="card">
                <h2>📊 API Statistics</h2>
                <div id="statsContainer">
                    <p style="color: #999;">Loading statistics...</p>
                </div>
                <button onclick="loadStats()">Update Stats</button>
            </div>
        </div>

        <!-- Data List Card -->
        <div class="card">
            <h2>📋 Recent Submissions</h2>
            <div style="margin-bottom: 15px;">
                <button onclick="loadData()" style="background: #28a745;">Load Data</button>
                <button onclick="clearAllData()" style="background: #dc3545; margin-left: 10px;">Clear All</button>
            </div>
            <div id="dataList" class="data-list">
                <p style="color: #999;">No data loaded yet. Click "Load Data" to fetch submissions.</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        // Show alert message
        function showAlert(message, type = 'info') {
            const alertsDiv = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertsDiv.appendChild(alert);

            setTimeout(() => alert.remove(), 5000);
        }

        // Check backend health
        async function checkHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('statusBadge').textContent = '✓ Online';
                    document.getElementById('statusBadge').className = 'status-badge status-ok';
                    document.getElementById('uptime').textContent = `${(data.uptime).toFixed(2)}s`;
                    document.getElementById('lastCheck').textContent = new Date().toLocaleString();
                    showAlert('✓ Backend is healthy', 'success');
                } else {
                    throw new Error('Unhealthy response');
                }
            } catch (error) {
                document.getElementById('statusBadge').textContent = '✗ Offline';
                document.getElementById('statusBadge').className = 'status-badge status-error';
                showAlert('✗ Backend is offline or unreachable', 'error');
            }
        }

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/stats`);
                const data = await response.json();

                if (response.ok) {
                    const { database, metrics } = data;
                    document.getElementById('statsContainer').innerHTML = `
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="stat-value">${database.totalEntries}</div>
                                <div class="stat-label">Total Entries</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value">${metrics.requestsPerMinute}</div>
                                <div class="stat-label">Req/min</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value">${metrics.averageDuration}ms</div>
                                <div class="stat-label">Avg Duration</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value">${metrics.totalRequests}</div>
                                <div class="stat-label">Total Requests</div>
                            </div>
                        </div>
                    `;
                    showAlert('✓ Statistics updated', 'success');
                } else {
                    throw new Error('Failed to fetch stats');
                }
            } catch (error) {
                showAlert('✗ Failed to load statistics', 'error');
            }
        }

        // Load data entries
        async function loadData() {
            try {
                const response = await fetch(`${API_URL}/data?limit=50`);
                const data = await response.json();

                if (response.ok && data.entries.length > 0) {
                    const html = data.entries.map(entry => `
                        <div class="data-item">
                            <div class="data-item-header">
                                <span class="data-item-id">ID: ${entry.id.substring(0, 8)}...</span>
                                <span class="data-item-time">${new Date(entry.timestamp).toLocaleString()}</span>
                            </div>
                            <div class="data-item-content">${entry.data}</div>
                            ${entry.userId ? `<div style="font-size: 0.85rem; color: #999; margin-top: 8px;">User: ${entry.userId}</div>` : ''}
                            <button class="delete-btn" onclick="deleteData('${entry.id}')">Delete</button>
                        </div>
                    `).join('');
                    document.getElementById('dataList').innerHTML = html;
                    showAlert(`✓ Loaded ${data.entries.length} entries`, 'success');
                } else {
                    document.getElementById('dataList').innerHTML = '<p style="color: #999;">No data found.</p>';
                    showAlert('No data submissions yet', 'info');
                }
            } catch (error) {
                showAlert('✗ Failed to load data', 'error');
            }
        }

        // Submit new data
        document.getElementById('submitForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = document.getElementById('data').value;
            const userId = document.getElementById('userId').value || null;

            try {
                const response = await fetch(`${API_URL}/data`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data, userId }),
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('✓ Data submitted successfully!', 'success');
                    document.getElementById('submitForm').reset();
                    loadData();
                    loadStats();
                } else {
                    showAlert(`✗ Submission failed: ${result.error}`, 'error');
                }
            } catch (error) {
                showAlert('✗ Network error during submission', 'error');
            }
        });

        // Delete data entry
        async function deleteData(id) {
            if (!confirm('Are you sure you want to delete this entry?')) return;

            try {
                const response = await fetch(`${API_URL}/data/${id}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    showAlert('✓ Entry deleted successfully', 'success');
                    loadData();
                    loadStats();
                } else {
                    showAlert('✗ Failed to delete entry', 'error');
                }
            } catch (error) {
                showAlert('✗ Delete operation failed', 'error');
            }
        }

        // Clear all data
        async function clearAllData() {
            if (!confirm('Are you sure you want to delete ALL entries? This cannot be undone.')) return;

            try {
                const response = await fetch(`${API_URL}/data?limit=1000`);
                const data = await response.json();

                let deleted = 0;
                for (const entry of data.entries) {
                    await fetch(`${API_URL}/data/${entry.id}`, { method: 'DELETE' });
                    deleted++;
                }

                showAlert(`✓ Deleted ${deleted} entries`, 'success');
                loadData();
                loadStats();
            } catch (error) {
                showAlert('✗ Failed to clear data', 'error');
            }
        }

        // Initialize dashboard
        window.addEventListener('load', () => {
            checkHealth();
            loadStats();
            loadData();

            // Auto-refresh health status every 30 seconds
            setInterval(checkHealth, 30000);
        });

        // Prevent form submission on enter in textarea
        document.getElementById('data').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('submitForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
